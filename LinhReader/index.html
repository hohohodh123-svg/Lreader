
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Linh Reader</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f0e4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style"
 content="default">
<meta name="apple-mobile-web-app-title"
 content="Linh Reader">

<style>
* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Arial,sans-serif;
  background:#eee8dc;
  color:#26221e;
}

button {
  border:0;
  border-radius:9px;
  padding:9px 11px;
  font-size:15px;
  background:#ddd6c8;
  color:#222;
  cursor:pointer;
}

button:active { opacity:.65; }
.hidden { display:none!important; }

/* TỦ SÁCH */

#libraryScreen { min-height:100%; }

.libraryHeader {
  min-height:62px;
  display:flex;
  position:sticky;
  top:0;
  z-index:10;
  align-items:center;
  justify-content:space-between;
  padding:10px 14px;
  background:#f6f0e4;
  border-bottom:1px solid #ccc;
}

.libraryHeader h1 {
  margin:0;
  font-size:19px;
}

.addBookLabel {
  background:#d8cfbf;
  padding:10px;
  border-radius:9px;
  font-size:14px;
  cursor:pointer;
}

#pdfInput { display:none; }

#libraryContent {
  max-width:760px;
  padding:16px 12px 40px;
  margin:auto;
}

#libraryEmpty {
  text-align:center;
  margin-top:95px;
  color:#777;
}

#bookList {
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}

.bookCard {
  min-height:220px;
  background:#f8f3e9;
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.bookCover {
  height:90px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#d9ceba;
  border-radius:9px;
  margin-bottom:10px;
}

.bookTitle {
  font-weight:600;
  font-size:14px;
  line-height:1.4;
  overflow-wrap:anywhere;
  margin-bottom:8px;
}

.bookMeta {
  font-size:12px;
  line-height:1.5;
  color:#777;
}

.progressTrack {
  height:5px;
  margin-top:8px;
  background:#ddd;
  border-radius:9px;
  overflow:hidden;
}

.progressBar {
  height:100%;
  background:#79746a;
}

.bookActions {
  display:flex;
  gap:6px;
  margin-top:12px;
}

.openBookBtn { flex:1; }
.deleteBookBtn { width:42px; }

/* THÔNG BÁO */

#statusBox {
  position:fixed;
  top:74px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  display:none;
  padding:12px 16px;
  border-radius:11px;
  max-width:90vw;
  background:rgba(25,25,25,.9);
  color:#fff;
  font-size:14px;
  text-align:center;
  white-space:pre-line;
  line-height:1.5;
}

/* MÀN HÌNH ĐỌC */

#readerScreen {
  position:fixed;
  inset:0;
  z-index:50;
  background:#eee8dc;
  overflow:hidden;
}

.readerHeader {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:55px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 8px;
  background:#f6f0e4;
  border-bottom:1px solid #ccc;
  z-index:20;
  transition:transform .22s,opacity .22s;
}

#readerBookTitle {
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:14px;
  font-weight:600;
}

#viewer {
  position:absolute;
  top:55px;
  bottom:62px;
  left:0;
  right:0;
  padding:10px;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y pinch-zoom;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  transition:top .22s,bottom .22s;
}

#pdfCanvas {
  display:none;
  background:white;
  max-width:100%;
  height:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.2);
}

/* READER MODE - CĂN ĐỀU HAI LỀ */

#readerView {
  display:none;
  width:100%;
  max-width:680px;
  padding:12px 12px 55px;
  font-size:21px;
  line-height:1.72;
  overflow-wrap:break-word;
  word-break:normal;
}

.readerParagraph,
.readerDialogue,
.readerBullet {
  text-align:justify;
  text-align-last:left;
  line-height:1.72;
}

.readerParagraph {
  margin:0 0 1.05em;
}

.readerDialogue {
  margin:0 0 1em;
}

.readerBullet {
  margin:0 0 .7em;
}

.readerHeading {
  text-align:left;
  font-weight:700;
  line-height:1.45;
  margin:.7em 0 1em;
}

/* THANH CÔNG CỤ */

.bottomBar {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  min-height:62px;
  padding:5px 3px;
  background:#f6f0e4;
  border-top:1px solid #ccc;
  display:flex;
  align-items:center;
  justify-content:space-around;
  z-index:20;
  transition:transform .22s,opacity .22s;
}

.bottomBar button {
  font-size:14px;
  padding:8px 7px;
}

#pageInfo {
  font-size:12px;
  min-width:46px;
  text-align:center;
}

.controls-hidden .readerHeader {
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none;
}

.controls-hidden .bottomBar {
  transform:translateY(100%);
  opacity:0;
  pointer-events:none;
}

.controls-hidden #viewer {
  top:0;
  bottom:0;
}

/* MÀU GIẤY */

#readerScreen.sepia {
  background:#e9dfc7;
  color:#3e3427;
}

.sepia .readerHeader,
.sepia .bottomBar {
  background:#e9dfc7;
}

.sepia canvas {
  filter:sepia(.3) brightness(.9);
}

#readerScreen.night {
  background:#171717;
  color:#d8d8d8;
}

.night .readerHeader,
.night .bottomBar {
  background:#222;
  border-color:#444;
}

.night button {
  background:#444;
  color:#eee;
}

.night canvas {
  filter:brightness(.6);
}

@media(max-width:420px) {
  #bookList {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .libraryHeader h1 { font-size:18px; }
}
</style>
</head>

<body>

<div id="statusBox"></div>

<section id="libraryScreen">
  <div class="libraryHeader">
    <h1>📚 Linh Reader</h1>
    <label class="addBookLabel" for="pdfInput">
      ＋ Thêm sách
    </label>
    <input id="pdfInput" type="file"
      accept=".pdf,application/pdf" multiple>
  </div>

  <div id="libraryContent">
    <div id="libraryEmpty">
      <div style="font-size:52px">📖</div>
      <h2>Chưa có sách</h2>
      <p>Nhấn ＋ Thêm sách để chọn PDF.</p>
    </div>
    <div id="bookList"></div>
  </div>
</section>

<section id="readerScreen" class="hidden">
  <div class="readerHeader">
    <button id="backBtn">‹</button>
    <div id="readerBookTitle"></div>
  </div>

  <div id="viewer">
    <canvas id="pdfCanvas"></canvas>
    <div id="readerView"></div>
  </div>

  <div class="bottomBar">
    <button id="prevBtn">◀</button>
    <button id="zoomOut">A−</button>
    <span id="pageInfo">0 / 0</span>
    <button id="zoomIn">A+</button>
    <button id="modeBtn">Reader</button>
    <button id="themeBtn">☀</button>
    <button id="nextBtn">▶</button>
  </div>
</section>

<script src="lib/pdf.min.js"></script>
<script>
"use strict";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "lib/pdf.worker.min.js";

/* INDEXEDDB - GIỮ TƯƠNG THÍCH DỮ LIỆU CŨ */

const DB_NAME = "LinhReaderDB";
const DB_VERSION = 2;
const BOOK_STORE = "books";
const STATE_STORE = "bookState";

let db = null;

function openDatabase() {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = event => {
      const database = event.target.result;

      if (!database.objectStoreNames.contains(BOOK_STORE)) {
        database.createObjectStore(
          BOOK_STORE,{keyPath:"id"}
        );
      }

      if (!database.objectStoreNames.contains(STATE_STORE)) {
        database.createObjectStore(
          STATE_STORE,{keyPath:"id"}
        );
      }
    };

    request.onblocked = () => {
      showStatus("Đóng các tab Linh Reader khác.");
    };

    request.onsuccess = () => {
      db = request.result;
      db.onversionchange = () => db.close();
      resolve(db);
    };

    request.onerror = () => reject(request.error);
  });
}

function readRecord(storeName,id) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(storeName,"readonly");
    const request = tx.objectStore(storeName).get(id);
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function readAll(storeName) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(storeName,"readonly");
    const request = tx.objectStore(storeName).getAll();
    request.onsuccess = () => resolve(request.result||[]);
    request.onerror = () => reject(request.error);
  });
}

function writeRecord(storeName,value,method="put") {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(storeName,"readwrite");

    tx.oncomplete = () => resolve();
    tx.onerror = () =>
      reject(tx.error||new Error("Lỗi lưu dữ liệu"));
    tx.onabort = () =>
      reject(tx.error||new Error("Giao dịch bị hủy"));

    tx.objectStore(storeName)[method](value);
  });
}

function deleteStoredBook(id) {
  return new Promise((resolve,reject) => {
    const tx = db.transaction(
      [BOOK_STORE,STATE_STORE],"readwrite"
    );

    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);

    tx.objectStore(BOOK_STORE).delete(id);
    tx.objectStore(STATE_STORE).delete(id);
  });
}

/* TRẠNG THÁI ỨNG DỤNG */

let pdfDocument = null;
let currentBook = null;
let currentState = null;
let rendering = false;
let openingBook = false;
let controlsHidden = false;
let touchStart = null;

const el = id => document.getElementById(id);

const canvas = el("pdfCanvas");
const ctx = canvas.getContext("2d");

const viewer = el("viewer");
const readerView = el("readerView");
const readerScreen = el("readerScreen");
const libraryScreen = el("libraryScreen");
const bookList = el("bookList");
const modeBtn = el("modeBtn");
const themeBtn = el("themeBtn");

let statusTimer = null;

function showStatus(message,duration=0) {
  clearTimeout(statusTimer);
  el("statusBox").textContent = message;
  el("statusBox").style.display = "block";

  if (duration>0) {
    statusTimer = setTimeout(hideStatus,duration);
  }
}

function hideStatus() {
  clearTimeout(statusTimer);
  el("statusBox").style.display = "none";
}

function formatSize(bytes) {
  if (bytes<1024*1024) {
    return Math.round(bytes/1024)+" KB";
  }

  return (bytes/(1024*1024)).toFixed(1)+" MB";
}

function createId() {
  return Date.now().toString(36)+"-"
    +Math.random().toString(36).slice(2,10);
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = String(text??"");
  return div.innerHTML;
}

/* BỘ SỬA MÃ TIẾNG VIỆT */

function cleanVietnameseText(text) {
  if (!text) return "";

  text = String(text).normalize("NFC");

  const replacements = {
    "\u04E6":"Ợ",
    "\u04E7":"ợ",
    "\u04EC":"Ứ",
    "\u04ED":"ứ",
    "\u04EE":"Ừ",
    "\u04EF":"ừ",
    "\u04F0":"Ử",
    "\u04F1":"ử",
    "\u04F2":"Ữ",
    "\u04F3":"ữ",
    "\u04F4":"Ự",
    "\u04F5":"ự",
    "\u04FA":"Ỹ",
    "\u04FB":"ỹ"
  };

  for (const bad in replacements) {
    text = text.split(bad).join(replacements[bad]);
  }

  return text
    .replace(/[\u200B\u200C\u200D\uFEFF]/g,"")
    .replace(/[ \t]+/g," ")
    .trim();
}

function detectSuspiciousCharacters(text) {
  const cleaned = cleanVietnameseText(text);
  const found = cleaned.match(/[\u0400-\u052F]/g);

  if (found) {
    for (const char of new Set(found)) {
      console.warn(
        "Ký tự chưa sửa:",
        char,
        "U+"+char.charCodeAt(0)
          .toString(16).toUpperCase()
      );
    }
  }
}

/* NHẬN DIỆN ĐOẠN VĂN VÀ HỘI THOẠI */

function median(numbers) {
  if (!numbers.length) return 0;

  const sorted = [...numbers].sort((a,b) => a-b);
  const mid = Math.floor(sorted.length/2);

  return sorted.length%2
    ? sorted[mid]
    : (sorted[mid-1]+sorted[mid])/2;
}

function percentile(numbers,p) {
  if (!numbers.length) return 0;

  const sorted = [...numbers].sort((a,b) => a-b);
  const index = Math.floor((sorted.length-1)*p);
  return sorted[index];
}

function normalizeSpacing(text) {
  return text
    .replace(/\s+([,.;:!?%)\]»”])/g,"$1")
    .replace(/([(\[«“])\s+/g,"$1")
    .replace(/\s{2,}/g," ")
    .trim();
}

function mergeLines(a,b) {
  if (/[A-Za-zÀ-ỹĐđ]-$/.test(a)
      && /^[a-zà-ỹđ]/.test(b)) {
    return normalizeSpacing(a.slice(0,-1)+b);
  }

  return normalizeSpacing(a+" "+b);
}

function startsDialogue(text) {
  const t = text.trim();

  return /^[—–―−-]\s*\S/.test(t)
    || /^[“"«‘]/.test(t);
}

function isBullet(text) {
  return /^[•●▪◦*]\s*/.test(text)
    || /^\d+[.)]\s+/.test(text)
    || /^[a-zA-Z][.)]\s+/.test(text);
}

function isHeading(line) {
  const text = line.text;

  const letters = Array.from(text).filter(ch =>
    ch.toLowerCase()!==ch.toUpperCase()
  );

  if (letters.length<4 || text.length>110) {
    return false;
  }

  const uppercase = letters.filter(ch =>
    ch===ch.toUpperCase()
  );

  return uppercase.length/letters.length>.8
    && !/[.!?]$/.test(text);
}

function endsSentence(text) {
  return /[.!?…][”"'’»)]*$/.test(text.trim());
}

function buildParagraphs(lines) {
  if (!lines.length) return [];

  const left = percentile(
    lines.map(line => line.x),.25
  );

  const right = percentile(
    lines.map(line => line.right),.78
  );

  const columnWidth = Math.max(100,right-left);
  const gaps = [];

  for (let i=1;i<lines.length;i++) {
    const gap = lines[i-1].y-lines[i].y;
    if (gap>2 && gap<70) gaps.push(gap);
  }

  const normalGap = median(gaps)||14;
  const result = [];
  let current = null;

  for (const line of lines) {
    const dialogue = startsDialogue(line.text);
    const bullet = isBullet(line.text);
    const heading = isHeading(line);

    const type = heading
      ? "heading"
      : dialogue ? "dialogue"
      : bullet ? "bullet" : "paragraph";

    if (!current) {
      current = {text:line.text,type,last:line};
      continue;
    }

    const previous = current.last;
    const verticalGap = previous.y-line.y;

    const largeGap =
      verticalGap>normalGap*1.35;

    const newIndent =
      line.x-left>Math.max(12,normalGap*.85)
      && Math.abs(previous.x-left)<16;

    const previousShort =
      previous.right
      <right-Math.max(18,columnWidth*.12);

    const finishedParagraph =
      previousShort&&endsSentence(previous.text);

    const newParagraph =
      dialogue || bullet || heading
      || current.type==="heading"
      || largeGap || newIndent
      || finishedParagraph;

    if (newParagraph) {
      result.push(current);
      current = {text:line.text,type,last:line};
    } else {
      current.text = mergeLines(
        current.text,line.text
      );
      current.last = line;
    }
  }

  if (current) result.push(current);
  return result;
}

/* TỦ SÁCH */

async function renderLibrary() {
  const [books,states] = await Promise.all([
    readAll(BOOK_STORE),
    readAll(STATE_STORE)
  ]);

  const stateMap = new Map(
    states.map(state => [state.id,state])
  );

  books.sort((a,b) =>
    (b.lastOpenedAt||b.addedAt||0)
    -(a.lastOpenedAt||a.addedAt||0)
  );

  bookList.innerHTML = "";

  el("libraryEmpty").classList.toggle(
    "hidden",books.length>0
  );

  for (const book of books) {
    const state = stateMap.get(book.id)||book;
    const page = state.currentPage||1;
    const total =
      state.totalPages||book.totalPages||0;

    const progress = total
      ? Math.min(100,Math.round(page/total*100))
      : 0;

    const card = document.createElement("div");
    card.className = "bookCard";

    card.innerHTML = `
      <div>
        <div class="bookCover">📕</div>
        <div class="bookTitle">
          ${escapeHTML(book.name)}
        </div>
        <div class="bookMeta">
          ${total
            ? `Trang ${page} / ${total}`
            : "Chưa mở sách"}
          <br>
          ${formatSize(book.size||0)}
          ${total ? ` · ${progress}%` : ""}
        </div>
        <div class="progressTrack">
          <div class="progressBar"
               style="width:${progress}%"></div>
        </div>
      </div>
      <div class="bookActions">
        <button class="openBookBtn">Đọc</button>
        <button class="deleteBookBtn">🗑</button>
      </div>
    `;

    card.querySelector(".openBookBtn").onclick =
      () => openStoredBook(book.id);

    card.querySelector(".deleteBookBtn").onclick =
      async () => {
        if (!confirm("Xóa sách?\n\n"+book.name)) {
          return;
        }

        try {
          await deleteStoredBook(book.id);
          await renderLibrary();
        } catch (error) {
          alert("Không xóa được sách: "+error.message);
        }
      };

    bookList.appendChild(card);
  }
}

/* IMPORT PDF NHẸ */

el("pdfInput").addEventListener("change",async event => {
  const files = Array.from(event.target.files||[]);
  if (!files.length) return;

  el("pdfInput").disabled = true;
  let success = 0;

  for (const file of files) {
    if (!file.name.toLowerCase().endsWith(".pdf")
        && file.type!=="application/pdf") {
      alert("Chỉ hỗ trợ PDF: "+file.name);
      continue;
    }

    showStatus(
      "Đang lưu "+file.name
      +"\n"+formatSize(file.size)
    );

    try {
      const book = {
        id:createId(),
        name:file.name,
        size:file.size,
        type:"application/pdf",
        blob:file,
        totalPages:0,
        currentPage:1,
        readerMode:false,
        readerFontSize:21,
        scale:1.2,
        theme:0,
        addedAt:Date.now(),
        lastOpenedAt:Date.now()
      };

      await writeRecord(BOOK_STORE,book,"add");
      success++;

    } catch (error) {
      console.error("Lỗi lưu PDF:",error);

      const message = error.name==="QuotaExceededError"
        ? "Không đủ bộ nhớ Safari."
        : error.name+": "+error.message;

      alert(
        "Không thể lưu:\n"+file.name
        +"\n\n"+message
      );
    }
  }

  el("pdfInput").value = "";
  el("pdfInput").disabled = false;

  await renderLibrary();

  showStatus(
    "Đã lưu "+success+"/"+files.length+" sách.",
    2500
  );
});

/* LƯU TRẠNG THÁI RIÊNG, KHÔNG GHI LẠI PDF */

function makeCurrentState() {
  return {
    id:currentBook.id,
    currentPage:currentState.currentPage,
    totalPages:currentState.totalPages,
    readerMode:currentState.readerMode,
    readerFontSize:currentState.readerFontSize,
    scale:currentState.scale,
    theme:currentState.theme,
    lastOpenedAt:Date.now()
  };
}

async function saveCurrentState() {
  if (!currentBook||!currentState) return;

  try {
    await writeRecord(
      STATE_STORE,
      makeCurrentState()
    );
  } catch (error) {
    console.error("Lỗi lưu tiến độ:",error);
    showStatus("Chưa lưu được tiến độ.",2500);
  }
}

/* MỞ SÁCH */

async function openStoredBook(id) {
  if (pdfDocument||rendering||openingBook) return;

  openingBook = true;
  showStatus("Đang mở sách...");

  try {
    const book = await readRecord(BOOK_STORE,id);
    const saved = await readRecord(STATE_STORE,id);

    if (!book||!book.blob) {
      throw new Error("Không tìm thấy dữ liệu PDF.");
    }

    currentBook = book;
    currentState = {
      id,
      currentPage:saved?.currentPage
        ||book.currentPage||1,
      totalPages:saved?.totalPages
        ||book.totalPages||0,
      readerMode:saved?.readerMode
        ??book.readerMode??false,
      readerFontSize:saved?.readerFontSize
        ||book.readerFontSize||21,
      scale:saved?.scale
        ||book.scale||1.2,
      theme:saved?.theme
        ??book.theme??0
    };

    const buffer = await book.blob.arrayBuffer();

    pdfDocument = await pdfjsLib.getDocument({
      data:buffer
    }).promise;

    currentState.totalPages = pdfDocument.numPages;
    currentState.currentPage = Math.max(
      1,
      Math.min(
        currentState.currentPage,
        pdfDocument.numPages
      )
    );

    libraryScreen.classList.add("hidden");
    readerScreen.classList.remove("hidden");
    readerScreen.classList.remove("controls-hidden");

    controlsHidden = false;

    el("readerBookTitle").textContent = book.name;
    modeBtn.textContent =
      currentState.readerMode?"PDF":"Reader";

    applyTheme();
    await renderCurrentPage();
    await saveCurrentState();
    hideStatus();

  } catch (error) {
    console.error("Lỗi mở PDF:",error);
    hideStatus();

    alert("Không thể mở PDF.\n\n"+error.message);

    if (pdfDocument) {
      try { await pdfDocument.destroy(); }
      catch (_) {}
    }

    pdfDocument = null;
    currentBook = null;
    currentState = null;

    readerScreen.classList.add("hidden");
    libraryScreen.classList.remove("hidden");

  } finally {
    openingBook = false;
  }
}

/* RENDER TRANG */

async function renderCurrentPage(resetScroll=true) {
  if (!pdfDocument||rendering) return;

  rendering = true;

  try {
    if (resetScroll) viewer.scrollTop = 0;

    if (currentState.readerMode) {
      await renderReader();
    } else {
      await renderPDF();
    }

    el("pageInfo").textContent =
      currentState.currentPage
      +" / "+pdfDocument.numPages;

  } catch (error) {
    console.error("Lỗi trang:",error);
    showStatus("Không thể hiển thị trang.",2200);

  } finally {
    rendering = false;
  }
}

async function renderPDF() {
  readerView.style.display = "none";
  canvas.style.display = "block";

  const page = await pdfDocument.getPage(
    currentState.currentPage
  );

  let viewport = page.getViewport({
    scale:currentState.scale
  });

  const maxPixels = 3000000;
  const area = viewport.width*viewport.height;

  if (area>maxPixels) {
    const factor = Math.sqrt(maxPixels/area);
    viewport = page.getViewport({
      scale:currentState.scale*factor
    });
  }

  canvas.width = Math.round(viewport.width);
  canvas.height = Math.round(viewport.height);

  await page.render({
    canvasContext:ctx,
    viewport
  }).promise;
}

/* READER MODE */

async function renderReader() {
  canvas.style.display = "none";
  readerView.style.display = "block";
  readerView.textContent = "Đang xử lý chữ...";

  const page = await pdfDocument.getPage(
    currentState.currentPage
  );

  const textContent = await page.getTextContent();
  const rawLines = [];

  for (const item of textContent.items) {
    if (!item.str||!item.str.trim()) continue;

    detectSuspiciousCharacters(item.str);

    const text = cleanVietnameseText(item.str);
    if (!text) continue;

    const x = Number(item.transform[4]);
    const y = Number(item.transform[5]);

    let line = rawLines.find(
      existing => Math.abs(existing.y-y)<3.5
    );

    if (!line) {
      line = {y,items:[]};
      rawLines.push(line);
    }

    line.items.push({
      x,
      width:Number(item.width)||0,
      text
    });
  }

  rawLines.sort((a,b) => b.y-a.y);

  const lines = rawLines.map(line => {
    line.items.sort((a,b) => a.x-b.x);

    const x = line.items[0].x;

    const right = Math.max(
      ...line.items.map(item => item.x+item.width)
    );

    const text = normalizeSpacing(
      line.items.map(item => item.text).join(" ")
    );

    return {x,right,y:line.y,text};
  }).filter(line => line.text);

  const paragraphs = buildParagraphs(lines);

  readerView.innerHTML = paragraphs.length
    ? paragraphs.map(paragraph => {
        const className =
          paragraph.type==="heading"
            ? "readerHeading"
            : paragraph.type==="dialogue"
              ? "readerDialogue"
              : paragraph.type==="bullet"
                ? "readerBullet"
                : "readerParagraph";

        return `<div class="${className}">`
          +escapeHTML(paragraph.text)
          +"</div>";
      }).join("")
    : "<p>Không tìm thấy chữ. PDF có thể là bản scan.</p>";

  readerView.style.fontSize =
    currentState.readerFontSize+"px";
}

/* CHUYỂN TRANG */

async function changePage(direction) {
  if (!pdfDocument||rendering) return;

  const next = currentState.currentPage+direction;

  if (next<1||next>pdfDocument.numPages) return;

  currentState.currentPage = next;
  await renderCurrentPage();
  await saveCurrentState();
}

el("prevBtn").onclick = () => changePage(-1);
el("nextBtn").onclick = () => changePage(1);

/* TĂNG GIẢM CỠ CHỮ / ZOOM */

async function changeSize(direction) {
  if (!pdfDocument||rendering) return;

  if (currentState.readerMode) {
    currentState.readerFontSize = Math.max(
      14,
      Math.min(40,
        currentState.readerFontSize+direction*2)
    );

    readerView.style.fontSize =
      currentState.readerFontSize+"px";

  } else {
    currentState.scale = Math.max(
      .5,
      Math.min(3,
        currentState.scale+direction*.15)
    );

    await renderCurrentPage(false);
  }

  await saveCurrentState();
}

el("zoomOut").onclick = () => changeSize(-1);
el("zoomIn").onclick = () => changeSize(1);

/* CHUYỂN READER / PDF */

modeBtn.onclick = async () => {
  if (!pdfDocument||rendering) return;

  currentState.readerMode = !currentState.readerMode;

  modeBtn.textContent =
    currentState.readerMode?"PDF":"Reader";

  await renderCurrentPage();
  await saveCurrentState();
};

/* CHẾ ĐỘ MÀU */

function applyTheme() {
  readerScreen.classList.remove("night","sepia");

  if (currentState.theme===1) {
    readerScreen.classList.add("sepia");
    themeBtn.textContent = "📜";
  } else if (currentState.theme===2) {
    readerScreen.classList.add("night");
    themeBtn.textContent = "🌙";
  } else {
    themeBtn.textContent = "☀";
  }
}

themeBtn.onclick = async () => {
  if (!currentState) return;

  currentState.theme =
    (currentState.theme+1)%3;

  applyTheme();
  await saveCurrentState();
};

/* ẨN THANH CÔNG CỤ */

function toggleControls() {
  controlsHidden = !controlsHidden;

  readerScreen.classList.toggle(
    "controls-hidden",controlsHidden
  );
}

/* VUỐT CHUYỂN TRANG IPHONE */

viewer.addEventListener("touchstart",event => {
  if (event.touches.length!==1) {
    touchStart = null;
    return;
  }

  const touch = event.touches[0];

  touchStart = {
    x:touch.clientX,
    y:touch.clientY,
    time:Date.now()
  };
},{passive:true});

viewer.addEventListener("touchmove",event => {
  if (event.touches.length!==1) {
    touchStart = null;
  }
},{passive:true});

viewer.addEventListener("touchcancel",() => {
  touchStart = null;
},{passive:true});

viewer.addEventListener("touchend",event => {
  if (!pdfDocument||!touchStart) return;
  if (event.changedTouches.length!==1) return;

  const touch = event.changedTouches[0];

  const dx = touch.clientX-touchStart.x;
  const dy = touch.clientY-touchStart.y;
  const ax = Math.abs(dx);
  const ay = Math.abs(dy);
  const duration = Date.now()-touchStart.time;

  touchStart = null;

  if (ax>=60&&ax>ay*1.25&&duration<1000) {
    changePage(dx<0?1:-1);
    return;
  }

  const height = window.innerHeight;

  if (ax<12&&ay<12&&duration<450
      &&touch.clientY>height*.25
      &&touch.clientY<height*.75) {
    toggleControls();
  }
},{passive:true});

viewer.addEventListener("click",event => {
  if ("ontouchstart" in window) return;

  const height = window.innerHeight;

  if (event.clientY>height*.25
      &&event.clientY<height*.75) {
    toggleControls();
  }
});

/* QUAY LẠI TỦ SÁCH */

async function closeCurrentBook() {
  if (rendering||openingBook) return;

  await saveCurrentState();

  if (pdfDocument) {
    try {
      await pdfDocument.destroy();
    } catch (error) {
      console.warn(error);
    }
  }

  pdfDocument = null;
  currentBook = null;
  currentState = null;

  canvas.width = 0;
  canvas.height = 0;

  readerView.innerHTML = "";
  readerView.style.display = "none";
  canvas.style.display = "none";

  readerScreen.classList.add("hidden");
  readerScreen.classList.remove("controls-hidden");
  libraryScreen.classList.remove("hidden");

  controlsHidden = false;

  await renderLibrary();
}

el("backBtn").onclick = closeCurrentBook;

document.addEventListener("visibilitychange",() => {
  if (document.hidden&&currentBook) {
    saveCurrentState();
  }
});

/* KHỞI ĐỘNG */

async function startApp() {
  try {
    await openDatabase();
    await renderLibrary();
  } catch (error) {
    console.error("IndexedDB:",error);

    alert(
      "Không mở được bộ nhớ Linh Reader.\n"
      +error.message
    );
  }
}

startApp();
